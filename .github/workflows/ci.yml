name: Verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit:production
      - run: pnpm build
      - run: npx --yes --package @playwright/cli@0.1.23 playwright-cli install-browser chromium --only-shell --with-deps
      - run: sh scripts/smoke-report-browser.sh
      - run: pnpm build:standalone
      - run: pnpm smoke:standalone
      - run: pnpm build:export
      - run: sh scripts/check-docker-isolation.sh
      - run: docker build --tag dgr-ci .
      - run: docker run --rm --entrypoint node dgr-ci -e "if (process.getuid() === 0) process.exit(1)"
      - run: |
          expected=$(node -p "require('next/package.json').version")
          actual=$(docker run --rm --entrypoint node dgr-ci -p "require('next/package.json').version")
          test "$expected" = "$actual"
